  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
  <link rel="preload" href="/assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    .nf { min-height: calc(100vh - var(--nav-h, 72px)); min-height: calc(100svh - var(--nav-h, 72px)); display: grid; place-items: center; padding: calc(var(--nav-h, 72px) + 48px) 24px 64px; text-align: center; }
    .nf__inner { max-width: 560px; }
    .nf__code { margin: 0 0 12px; font-size: 0.9375rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
    .nf h1 { margin: 0; font-size: clamp(2.125rem, 4.4vw, 3.75rem); line-height: 1.06; font-weight: 600; letter-spacing: -0.045em; color: var(--sv-ink); text-wrap: balance; }
    .nf p.nf__text { margin: 16px auto 32px; font-size: 1.0625rem; line-height: 1.55; color: var(--sv-text); }
  </style>
</head>
<body class="sv-page dz">
  <header class="nav" id="nav">
    <a href="/" class="nav__logo">

  <main class="sv nf">
    <div class="nf__inner">
      <p class="nf__code">Ошибка 404</p>
      <h1>Страница не найдена</h1>
      <p class="nf__text">Возможно, ссылка устарела или в адресе опечатка. Всё главное есть на главной странице.</p>
      <a href="/" class="btn btn--primary sv-btn">На главную</a>
    </div>
  </main>
</body>
