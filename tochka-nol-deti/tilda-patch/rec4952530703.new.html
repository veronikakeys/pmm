    if(a.getAttribute('href')==='#')e.preventDefault();
  });
  // подстановка возраста из карточки группы
  var LABEL={'3-4':'3–4 года','5-6':'5–6 лет','7-9':'7–9 лет','11-13':'11–13 лет','14-18':'14–18 лет'};
  function norm(s){return String(s||'').replace(/[–—]/g,'-').replace(/\s+/g,'').toLowerCase();}
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-age]'):null;if(!a)return;
    var age=a.getAttribute('data-age'),label=LABEL[age]||age;
    document.querySelectorAll('[name="age"],[name="Age"],[name="Возраст"],input[placeholder*="озраст"]').forEach(function(el){
      if(el.tagName==='SELECT'){for(var i=0;i<el.options.length;i++){var o=el.options[i];if(norm(o.value).indexOf(norm(age))===0||norm(o.text).indexOf(norm(age))===0){el.selectedIndex=i;break;}}}
      else if(el.type==='radio'||el.type==='checkbox'){if(norm(el.value).indexOf(norm(age))!==0)return;el.checked=true;}
      else{el.value=label;}
      el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));
    });
  });
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
(function(){
  // Форма Tilda: блок формы стоит сразу под этим блоком «HTML-код», скрипт переносит его в правую колонку
  var sec=document.querySelector('.tz-zapis');if(!sec||sec.getAttribute('data-form-ready'))return;sec.setAttribute('data-form-ready','1');
  var slot=sec.querySelector('.tz-zapis__slot');
  function adopt(){
    if(!slot||slot.querySelector('form'))return;
    var rec=sec.closest('.t-rec'),next=rec?rec.nextElementSibling:null;
    while(next&&!next.querySelector('form')&&next.offsetHeight===0)next=next.nextElementSibling; // пропускаем пустые служебные блоки
    if(next&&next.querySelector('form'))slot.appendChild(next);
  }
  adopt();addEventListener('load',adopt);
})();
